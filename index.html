<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CondoPack Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#EEF3FA;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

width:95%;

max-width:900px;

background:white;

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

overflow:hidden;

}

.header{

background:#1E4DB7;

padding:20px;

color:white;

text-align:center;

}

.header h1{

font-size:26px;

font-weight:700;

}

.header p{

margin-top:6px;

opacity:.9;

}

.video-area{

padding:25px;

}

video{

width:100%;

border-radius:14px;

background:black;

aspect-ratio:16/9;

object-fit:cover;

}

.actions{

display:flex;

justify-content:center;

gap:15px;

padding:0 25px 25px;

}

button{

padding:14px 28px;

border:none;

border-radius:10px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.capture{

background:#1E4DB7;

color:white;

}

.capture:hover{

background:#163C92;

}

.cancel{

background:#E5E7EB;

color:#374151;

}

.cancel:hover{

background:#D1D5DB;

}

.status{

padding:15px;

text-align:center;

font-weight:600;

color:#1E4DB7;

display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<h1>🏢 CondoPack2</h1>

</div>

<video id="cameraVideo" autoplay playsinline></video>
    <button id="btnCapturar" onclick="tirarFoto()">📷 Capturar Foto</button>
    <div id="status"></div>

    <script>
        // 1. PEGA AQUÍ LA URL DE TU SCRIPT DE GOOGLE (La que termina en /exec)
        const URL_GAS = "https://script.google.com/macros/s/TU_CODIGO_AQUI/exec";

        let cameraStream = null;
        
        // 2. Extraer parámetros de la URL (Enviados por tu sistema principal)
        const params = new URLSearchParams(window.location.search);
        const idEncomenda = params.get('id');
        const morador = params.get('morador');

        if(morador) {
            document.getElementById('titulo').innerText = "Entrega para: " + morador;
        }

        // 3. Iniciar Cámara de la PC
        async function iniciarCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById('cameraVideo').srcObject = cameraStream;
            } catch (error) {
                document.getElementById('status').innerText = "Erro ao acessar a câmera. Verifique as permissões.";
                document.getElementById('btnCapturar').disabled = true;
            }
        }

        // 4. Tomar foto, comprimir y enviar a Google Apps Script
        async function tirarFoto() {
            const video = document.getElementById("cameraVideo");
            const btn = document.getElementById('btnCapturar');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.innerText = "Enviando...";
            status.innerText = "Comprimindo imagem...";

            // Dibujar en canvas
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);

            // Comprimir a Base64
            const base64Comprimido = canvas.toDataURL("image/jpeg", 0.6);

            status.innerText = "Enviando para o sistema...";

            // Enviar vía POST a Google Apps Script
            try {
                const resposta = await fetch(URL_GAS, {
                    method: 'POST',
                    body: JSON.stringify({
                        acao: "uploadFotoPC",
                        idEncomenda: idEncomenda,
                        foto: base64Comprimido
                    })
                });

                const resultado = await resposta.json();

                if(resultado.success) {
                    status.style.color = "#4CAF50";
                    status.innerText = "Foto enviada! Pode fechar esta janela.";
                    // Apagar cámara
                    cameraStream.getTracks().forEach(track => track.stop());
                    
                    // Cerrar ventana automáticamente después de 2 segundos
                    setTimeout(() => window.close(), 2000);
                } else {
                    throw new Error(resultado.error);
                }
            } catch (erro) {
                status.style.color = "#ff4444";
                status.innerText = "Erro ao enviar: " + erro.message;
                btn.disabled = false;
                btn.innerText = "📷 Tentar Novamente";
            }
        }

        // Arrancar cámara al cargar la página
        window.onload = iniciarCamera;
    </script>
</body>
</html>
