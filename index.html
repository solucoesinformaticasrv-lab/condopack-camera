<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CondoPack Camera</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{

background:#EEF3FA;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.card{

width:95%;

max-width:900px;

background:white;

border-radius:18px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

overflow:hidden;

}

.header{

background:#1E4DB7;

padding:20px;

color:white;

text-align:center;

}

.header h1{

font-size:26px;

font-weight:700;

}

.header p{

margin-top:6px;

opacity:.9;

}

.video-area{

padding:25px;

}

video{

width:100%;

border-radius:14px;

background:black;

aspect-ratio:16/9;

object-fit:cover;

}

.actions{

display:flex;

justify-content:center;

gap:15px;

padding:0 25px 25px;

}

button{

padding:14px 28px;

border:none;

border-radius:10px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.capture{

background:#1E4DB7;

color:white;

}

.capture:hover{

background:#163C92;

}

.cancel{

background:#E5E7EB;

color:#374151;

}

.cancel:hover{

background:#D1D5DB;

}

.status{

padding:15px;

text-align:center;

font-weight:600;

color:#1E4DB7;

display:none;

}

</style>

</head>

<body>

<div class="card">

<div class="header">

<h1>🏢 CondoPack</h1>

</div>

<div class="video-area">

<video
id="video"
autoplay
playsinline>
</video>

</div>

<div class="actions">

<button
class="capture"
onclick="capturar()">

📷 Capturar

</button>

<button
class="cancel"
onclick="cancelar()">

❌ Cancelar

</button>

</div>

<div
id="status"
class="status">

Enviando imagem...

</div>

</div>

<script>

let stream=null;

async function iniciar(){

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:true,

audio:false

});

document
.getElementById("video")
.srcObject=stream;

}
catch(e){

alert("Não foi possível acessar a webcam.");

console.error(e);

}

}

function capturar(){

const video=document.getElementById("video");

const canvas=document.createElement("canvas");

canvas.width=video.videoWidth;

canvas.height=video.videoHeight;

canvas
.getContext("2d")
.drawImage(video,0,0);

const base64=
canvas.toDataURL("image/jpeg",0.75);

document
.getElementById("status")
.style.display="block";

if(window.opener){

  console.log("Enviando foto...");

console.log(base64.substring(0,50));
window.opener.postMessage({

tipo:"CONDOPACK_CAMERA",

foto:base64

},"https://script.google.com");

}

stream
.getTracks()
.forEach(track=>track.stop());

setTimeout(()=>{

window.close();

},600);

}

function cancelar(){

if(stream){

stream
.getTracks()
.forEach(track=>track.stop());

}

window.close();

}

iniciar();

</script>

</body>

</html>
