<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Foto da entrega · CondoPack</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=block">
  <link rel="stylesheet" href="camera.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-logo" aria-hidden="true">📦</span> CondoPack</div>
    <h1>Foto da entrega</h1>
  </header>

  <main class="card">
    <p class="hint">Fotografe o morador com a encomenda para comprovar a entrega.</p>

    <div class="preview" id="preview">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <img id="fotoPreview" alt="Foto capturada da entrega" hidden>
      <div class="preview-placeholder" id="placeholder">
        <span class="material-symbols-rounded" aria-hidden="true">photo_camera</span>
        <span id="placeholderTexto">Iniciando a câmera…</span>
      </div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite" hidden></div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnCapturar" disabled>
        <span class="material-symbols-rounded" aria-hidden="true">photo_camera</span> Capturar
      </button>
    </div>
  </main>

  <script src="camera.js"></script>
  <script src="index.js"></script>
</body>
</html>
